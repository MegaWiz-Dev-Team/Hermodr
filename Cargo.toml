[package]
name = "hermodr"
version = "0.1.0"
edition = "2021"
description = "Hermóðr — Universal MCP Sidecar. Lightweight Rust JSON-RPC 2.0 bridge that wraps REST services as MCP tools (Asgard AI Platform)"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10"

[dev-dependencies]
axum-test = "16"
tower = "0.5"
